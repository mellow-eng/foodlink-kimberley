{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h1>Student Login</h1>
    {% if error %}<p style="color: #c0392b; font-weight: bold;">{{ error }}</p>{% endif %}
    <form method="POST" action="/login">
        <label>Email:</label>
        <input type="email" name="email" required>
        <label>Password:</label>
        <input type="password" name="password" required>
        <button type="submit">Login</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
