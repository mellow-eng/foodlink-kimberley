{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h1>Donor Registration</h1>
    {% if error %}<p style="color: #c0392b; font-weight: bold;">{{ error }}</p>{% endif %}
    <form method="POST" action="/donor/register">
        <label>Organization/Name:</label>
        <input type="text" name="name" required>
        <label>Email:</label>
        <input type="email" name="email" required>
        <label>Password:</label>
        <input type="password" name="password" required>
        <label>Location:</label>
        <input type="text" name="location" required>
        <button type="submit">Register</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">Already have an account? <a href="{{ url_for('donor_login') }}">Log in</a></p>
</div>
{% endblock %}
